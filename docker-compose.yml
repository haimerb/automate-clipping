services:
  db:
    image: postgres:16-alpine
    container_name: edgetape-db
    environment:
      POSTGRES_USER: edgetape
      POSTGRES_PASSWORD: edgetape
      POSTGRES_DB: edgetape
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgetape -d edgetape"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
